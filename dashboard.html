<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Walcert Agent</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        input, select, button { padding: 10px; margin: 10px 0; background: #222; color: #0f0; border: 1px solid #0f0; }
        #logs { background: #000; padding: 15px; border: 1px solid #333; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Walcert Agent</h2>
    <p>Hot-analysis certificates (no x402 yet — local/dev).</p>

    <label>Certificate type</label><br>
    <select id="certType">
        <option value="origins">origins</option>
        <option value="activity">activity</option>
        <option value="multichain">multichain</option>
        <option value="portfolio">portfolio</option>
    </select>
    <br>
    <input type="text" id="targetWallet" placeholder="Wallet (0x...)" size="45">
    <br>
    <button id="runBtn">Request analysis</button>
    <div id="logs">Ready.</div>

    <script>
        function log(msg) {
            document.getElementById("logs").innerText += "\n[*] " + msg;
        }

        document.getElementById("runBtn").onclick = async () => {
            const type = document.getElementById("certType").value;
            const wallet = document.getElementById("targetWallet").value.trim();
            if (!wallet) return alert("Enter a wallet");
            log("POST /v1/preview/" + type);
            try {
                const res = await fetch("/v1/preview/" + type, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet_address: wallet })
                });
                const data = await res.json();
                log("HTTP " + res.status + "\n" + JSON.stringify(data, null, 2));
            } catch (err) {
                log("Error: " + err.message);
            }
        };
    </script>
</body>
</html>
